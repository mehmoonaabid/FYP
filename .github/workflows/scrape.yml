name: scrape
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m intellihire.cli run        # every registered source, one after another
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PHONE_SALT: ${{ secrets.PHONE_SALT }}
          SCRAPER_USER_AGENT: "IntelliHire-FYP/0.1 (academic research; contact: you@example.com)"
          MAX_NEW_PER_RUN: "100"
